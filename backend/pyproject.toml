[project]
name = "newstrade-backend"
version = "0.1.0"
description = "Crypto news trading platform backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "greenlet>=3.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "redis>=5.0",
    "telethon>=1.34",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "ccxt>=4.2",
    "pgvector>=0.2",
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
